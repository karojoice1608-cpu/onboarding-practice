<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>

<header>
    <h1>User Registration Form</h1>
</header>

<nav>
    <a href="#">Home</a> |
    <a href="#">About</a> |
    <a href="#">Contact</a>
</nav>

<main>

<form action="#" method="post">

    <fieldset>
        <legend>Account Credentials</legend>

        <label for="username">Username:</label><br>
        <input
            type="text"
            id="username"
            name="username"
            required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            required>
        <br><br>

        <label for="password">Password:</label><br>
        <input
            type="password"
            id="password"
            name="password"
            required>
    </fieldset>

    <br>

    <fieldset>
        <legend>Personal Profile</legend>

        <label for="age">Age:</label><br>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="60"
            required>
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input
            type="date"
            id="dob"
            name="dob"
            min="1965-01-01"
            max="2008-12-31"
            required>
        <br><br>

        <p>Preferred Contact Method</p>

        <input
            type="radio"
            id="emailContact"
            name="contact"
            value="Email"
            required>
        <label for="emailContact">Email</label>

        <input
            type="radio"
            id="phoneContact"
            name="contact"
            value="Phone">
        <label for="phoneContact">Phone</label>

        <br><br>

        <input
            type="checkbox"
            id="agree"
            name="agree"
            required>

        <label for="agree">
            I agree to the Terms and Conditions
        </label>

        <br><br>

        <label for="country">Country:</label><br>

        <select
            id="country"
            name="country"
            required>

            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>

        </select>

        <br><br>

        <label for="phone">Phone Number:</label><br>

        <input
            type="text"
            id="phone"
            name="phone"
            pattern="[0-9]{10}"
            placeholder="10-digit phone number"
            required>

        <br><br>

        <label for="bio">Tell us about yourself:</label><br>

        <textarea
            id="bio"
            name="bio"
            rows="5"
            cols="40"
            required></textarea>

    </fieldset>

    <br>

    <button type="submit">
        Register
    </button>

</form>

</main>

</body>
</html>
